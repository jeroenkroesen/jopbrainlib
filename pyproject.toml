[project]
name = "jopbrainlib"
version = "0.1.0a2"
description = "Automating a second brain in Joplin"
readme = "README.md"
authors = [
    { name = "Jeroen Kroesen", email = "jeroen@kroesen.nu" }
]
requires-python = ">=3.12"
dependencies = [
    "joppylib>=0.1.0a12",
    "pendulum>=3.1.0",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "python-liquid>=2.0.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
